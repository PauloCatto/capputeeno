<h2 mat-dialog-title>
  {{ data.title }}
</h2>

<mat-dialog-content>
  {{ data.message }}
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button *ngIf="data.showCancel !== false" mat-button (click)="onCancel()">
    {{ data.cancelText  }}
  </button>

  <button *ngIf="data.confirmText"
    mat-raised-button
    [color]="data.confirmColor || 'warn'"
    (click)="onConfirm()"
  >
    {{ data.confirmText }}
  </button>
</mat-dialog-actions>
