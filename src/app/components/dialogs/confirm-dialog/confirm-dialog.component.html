<h2 mat-dialog-title>{{ "delete_confirmation_title" | translate }}</h2>
<mat-dialog-content>{{
  "delete_confirmation_message" | translate
}}</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">
    {{ "cancel_button" | translate }}
  </button>
  <button mat-raised-button color="warn" (click)="onConfirm()">
    {{ "delete_button" | translate }}
  </button>
</mat-dialog-actions>
