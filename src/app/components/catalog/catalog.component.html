<div class="spinner-container" *ngIf="loading">
  <mat-progress-spinner
    color="primary"
    mode="indeterminate"
    diameter="50">
  </mat-progress-spinner>
</div>

<section class="container" *ngIf="filtered.length === 0">
  <div class="custom-tab-group">
    <div
      class="custom-tab"
      *ngFor="let tab of tabs; let i = index"
      [class.active]="selectedTab === i"
      (click)="selectTab(i)"
    >
      {{ tab.label | translate }}
      <div class="underline" *ngIf="selectedTab === i"></div>
    </div>
  </div>

  <div class="content">
    <div class="product-grid">
      <div
        *ngFor="let item of tabs[selectedTab]?.data"
        class="product-card"
        (click)="onProductClick(item)"
      >
        <img [src]="item.image_url" alt="{{ item.name | translate }}" />
        <h3 class="name">{{ item.name | translate }}</h3>
        <p class="divider"></p>
        <p class="price">
          {{
            item.price_in_cents / 100 | currency : "BRL" : "symbol" : "1.2-2"
          }}
        </p>
      </div>
    </div>
  </div>
</section>

<section class="container" *ngIf="filtered.length > 0">
  <div class="content filtered">
    <div class="product-grid">
      <div
        *ngFor="let item of filtered"
        class="product-card"
        (click)="onProductClick(item)"
      >
        <img [src]="item.image_url" alt="{{ item.name | translate }}" />
        <h3 class="name">{{ item.name | translate }}</h3>
        <p class="divider"></p>
        <p class="price">
          {{
            item.price_in_cents / 100 | currency : "BRL" : "symbol" : "1.2-2"
          }}
        </p>
      </div>
    </div>
  </div>
</section>
