<app-header></app-header>
<div class="checkout-container">
  <div class="card-preview">
    <div class="card-chip"></div>
    <div class="card-number">{{ checkoutForm.value.number || '**** **** **** ****' }}</div>
    <div class="card-footer">
      <div class="card-holder">{{ checkoutForm.value.holder || ('HOLDER_NAME' | translate) }}</div>
      <div class="card-expiry">{{ checkoutForm.value.expiry || 'MM/AA' }}</div>
    </div>
  </div>

  <form [formGroup]="checkoutForm" (ngSubmit)="submit()" class="payment-form">
    <h2>{{ 'PAYMENT' | translate }}</h2>

    <div class="form-group">
      <div class="form-group-column">
        <label for="holder">{{ 'HOLDER_LABEL' | translate }}</label>
        <input id="holder" formControlName="holder" [placeholder]="'HOLDER_PLACEHOLDER' | translate" />
      </div>
      <div class="form-group-column">
        <label for="number">{{ 'NUMBER_LABEL' | translate }}</label>
        <input
          id="number"
          formControlName="number"
          [placeholder]="'NUMBER_PLACEHOLDER' | translate"
          (input)="onCardNumberChange()" />
      </div>
    </div>

    <div class="form-group">
      <div class="form-group-column">
        <label for="expiry">{{ 'EXPIRY_LABEL' | translate }}</label>
        <input id="expiry" formControlName="expiry" placeholder="MM/AA" />
      </div>
      <div class="form-group-column">
        <label for="cvv">{{ 'CVV_LABEL' | translate }}</label>
        <input id="cvv" formControlName="cvv" placeholder="123" />
      </div>
    </div>

    <div class="form-group">
      <div class="form-group-column">
        <label>{{ 'METHOD_LABEL' | translate }}</label>
        <select formControlName="paymentMethod" (change)="onPaymentMethodChange()">
          <option value="credit">{{ 'CREDIT_OPTION' | translate }}</option>
          <option value="debit">{{ 'DEBIT_OPTION' | translate }}</option>
        </select>
      </div>

      <div class="form-group-column" *ngIf="selectedPaymentMethod === 'credit'">
        <label>{{ 'INSTALLMENTS_LABEL' | translate }}</label>
        <select formControlName="installments">
          <option *ngFor="let i of installments" [value]="i">
            {{ i }}x {{ 'INSTALLMENT_OF' | translate }} {{ getInstallmentValue(i) | currency:'BRL' }}
          </option>
        </select>
      </div>
    </div>

    <div class="total-price">{{ 'TOTAL' | translate }}: {{ totalAmount | currency:'BRL' }}</div>

    <button type="submit" class="pay-button">{{ 'PAY_BUTTON' | translate }}</button>
  </form>
</div>
