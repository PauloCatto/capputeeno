<section>
  <div class="header">
    <div>
      <h2 class="title" routerLink="home">capputeeno</h2>
    </div>

    <div class="header-container">
      <div class="search-container" *ngIf="router.url === '/'">
        <input
          type="text"
          [placeholder]="'search_placeholder' | translate"
          (input)="onSearch($event)"
        />
        <i class="material-icons">search</i>
      </div>

      <div class="scrolling-banner" *ngIf="router.url !== '/'">
        <div class="scrolling-text">
          💳 {{ "installments_text" | translate }} &nbsp;&nbsp;&nbsp;
          🚚 {{ "fast_shipping_text" | translate }}
        </div>
      </div>

      <div class="shopping-container">
        <div class="shopping-inner">
          <a routerLink="/shopping-cart">
            <img
              src="../../../assets/svgs/shopping-bag.svg"
              alt="Shopping Bag"
            />
            <span class="qtd-icon">
              {{ cartItemCount }}
            </span>
          </a>

          <button mat-icon-button [matMenuTriggerFor]="languageMenu">
            <mat-icon>language</mat-icon>
            <mat-icon>arrow_drop_down</mat-icon>
          </button>

          <mat-menu #languageMenu="matMenu">
            <button mat-menu-item (click)="switchLanguage('en')">
              English
            </button>
            <button mat-menu-item (click)="switchLanguage('pt')">
              Português
            </button>
            <button mat-menu-item (click)="switchLanguage('es')">
              Español
            </button>
          </mat-menu>
        </div>
      </div>
    </div>
  </div>
</section>
